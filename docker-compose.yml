name: atlas

services:
  postgres:
    image: postgres:17-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_change_me}
    ports:
      - "5432:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: atlas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    container_name: atlas-backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.2}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,testserver}
      JWT_ISSUER: ${JWT_ISSUER:-atlas-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-atlas-frontend}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      REGISTRATION_RATE_LIMIT_ATTEMPTS: ${REGISTRATION_RATE_LIMIT_ATTEMPTS:-5}
      REGISTRATION_RATE_LIMIT_WINDOW_SECONDS: ${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:-3600}
      PASSWORD_RESET_RATE_LIMIT_ATTEMPTS: ${PASSWORD_RESET_RATE_LIMIT_ATTEMPTS:-5}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:-3600}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_ATTEMPTS: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_ATTEMPTS:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_WINDOW_SECONDS:-900}
      RATE_LIMIT_RETENTION_HOURS: ${RATE_LIMIT_RETENTION_HOURS:-48}
      UPLOAD_ROOT: /app/storage/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      ALLOWED_DOCUMENT_EXTENSIONS: ${ALLOWED_DOCUMENT_EXTENSIONS:-.pdf,.docx}
      MAX_DOCX_UNCOMPRESSED_MB: ${MAX_DOCX_UNCOMPRESSED_MB:-50}
      MAX_DOCX_COMPRESSION_RATIO: ${MAX_DOCX_COMPRESSION_RATIO:-100}
      MAX_EXTRACTED_TEXT_CHARS: ${MAX_EXTRACTED_TEXT_CHARS:-5000000}
      DOCUMENT_EXTRACTION_TIMEOUT_SECONDS: ${DOCUMENT_EXTRACTION_TIMEOUT_SECONDS:-60}
      CHROMA_PERSIST_ROOT: /app/storage/vector
      MODEL_CACHE_ROOT: /app/storage/models
      HF_HOME: /app/storage/models/huggingface
      TRANSFORMERS_CACHE: /app/storage/models/huggingface
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_COOLDOWN_SECONDS: ${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@atlas.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ATLAS}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/vector:/app/storage/vector
      - ./storage/models:/app/storage/models
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-1}"
    stop_grace_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: atlas-ollama
    restart: unless-stopped
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - atlas_ollama_data:/root/.ollama

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_MAIL_PREVIEW_URL: ${VITE_MAIL_PREVIEW_URL:-http://localhost:8025}
    container_name: atlas-frontend
    restart: unless-stopped
    init: true
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  atlas_postgres_data:
  atlas_ollama_data:
